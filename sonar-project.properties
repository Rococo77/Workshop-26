# Analyse SonarQube (OPTIONNELLE) — ne s'exécute que si SONAR_TOKEN est défini
# dans les secrets du dépôt. Sans serveur Sonar, la CI reste verte (ruff + bandit
# couvrent déjà lint, format et sécurité).
sonar.projectKey=resilience-alpha
sonar.projectName=PROJECT RESILIENCE-ALPHA
sonar.sources=services,ml
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,services/frontend/dist/**
sonar.qualitygate.wait=true
