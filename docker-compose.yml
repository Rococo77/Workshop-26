# ============================================================================
#  PROJECT RESILIENCE-ALPHA — Orchestration du démonstrateur
# ----------------------------------------------------------------------------
#  Segmentation réseau (sujet §4 : DB, secrets, interfaces de gestion ne sont
#  PAS exposés au réseau pédagogique) :
#    edge    -> seul point publié (WAF) sur l'IP du PC Hôte (192.168.137.1)
#    app     -> services métier, non publiés
#    data    -> Postgres, strictement interne
#    obs     -> chaîne d'observabilité
#    control -> moteur de remédiation + proxy socket Docker, isolé
#    biometric -> API de reconnaissance faciale, joignable par payment-api seul
#
#  Durcissement (sujet §3.4, moindre privilège) :
#    - `no-new-privileges` sur TOUS les conteneurs (pas d'escalade setuid).
#    - `pids_limit` partout (anti fork-bomb, limite l'effet d'un flood/DoS).
#    - Le moteur de remédiation ne monte PLUS le socket Docker brut : il passe
#      par `docker-socket-proxy` qui n'autorise QUE inspect/restart/exec/logs.
# ============================================================================

name: resilience-alpha

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Socle de durcissement appliqué à chaque service (fusion YAML `<<: *sec`).
# - no-new-privileges : pas d'escalade via binaire setuid.
# - cap_drop ALL : aucune capability Linux par défaut (moindre privilège strict).
#   Les rares services qui en ont besoin les RÉ-ajoutent via `cap_add` (postgres).
x-sec: &sec
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  obs:
  control:
    internal: true
  biometric:
    internal: true
  # Coffre Vault isolé : aucun autre service n'y est rattaché. Non `internal`
  # uniquement pour publier son port sur 127.0.0.1 (administration locale).
  secrets:

volumes:
  pgdata:
  grafana-data:
  prometheus-data:
  loki-data:
  ollama-data:
  waf-dynamic:
  waf-logs:
  vault-data:

services:
  # ----------------------------------------------------------------- WAF (edge)
  waf:
    <<: *sec
    build: ./infra/waf
    container_name: ra-waf
    restart: unless-stopped
    pids_limit: 300
    depends_on:
      - frontend
      - payment-api
      - auth
      - supervision-bff
    ports:
      # Unique interface publiée, bindée sur l'IP du PC Hôte (sujet §4).
      # EDGE_BIND : interface d'écoute — 0.0.0.0 en local/CI, 192.168.137.1 en démo
      #             (le hotspot RESILIENCE-G<n>) pour n'exposer QUE le réseau du groupe.
      # EDGE_PORT : port hôte — 8080 par défaut ; changer si un service tiers
      #             occupe déjà 8080 (ex. Oracle TNS/APEX) sans arrêter ce dernier.
      - "${EDGE_BIND:-0.0.0.0}:${EDGE_PORT:-8080}:8080"
    environment:
      BACKEND_FRONTEND: "frontend:8080"
      BACKEND_API: "payment-api:8000"
      BACKEND_AUTH: "auth:8000"
      BACKEND_BFF: "supervision-bff:8000"
    volumes:
      - waf-dynamic:/etc/nginx/dynamic
      - waf-logs:/var/log/ra
    # Le healthcheck de l'image CRS sonde https://localhost:8443/healthz, absent
    # de notre config (seul :8080 est servi) -> toujours "unhealthy" sans ceci.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/waf-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [edge, app]
    logging: *default-logging
    labels:
      ra.role: "waf"

  # ------------------------------------------------------------- Frontend React
  frontend:
    <<: *sec
    build:
      context: ./services/frontend
      args:
        VITE_NUM_GROUPE: "${NUM_GROUPE:-}"
    container_name: ra-frontend
    restart: unless-stopped
    pids_limit: 200
    environment:
      VITE_API_BASE: "/api"
      VITE_AUTH_BASE: "/auth"
    networks: [app]
    logging: *default-logging
    labels:
      ra.role: "frontend"

  # --------------------------------------------------------------- API métier
  payment-api:
    <<: *sec
    build: ./services/payment-api
    container_name: ra-payment-api
    restart: unless-stopped
    pids_limit: 200
    read_only: true           # rootfs en lecture seule (durcissement)
    tmpfs:
      - /tmp                  # seul chemin inscriptible (fichiers temporaires)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_BASE_URL: "http://auth:8000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      FACE_PENDING_EXPIRE_SECONDS: ${FACE_PENDING_EXPIRE_SECONDS:-120}
      FACE_CONFIRMATION_REQUIRED: ${FACE_CONFIRMATION_REQUIRED:-true}
      FACE_API_URL: "http://face-api:5000"
      FACE_API_TOKEN: ${FACE_API_TOKEN:?FACE_API_TOKEN manquant dans .env}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.30}
      FACE_ANTI_SPOOFING: ${FACE_ANTI_SPOOFING:-true}
      REGISTRATION_STARTING_BALANCE: ${REGISTRATION_STARTING_BALANCE:-1000.00}
      # Relais WebSocket temps réel (indicateur LED ESP8266, voir firmware/face-led/).
      ESP_EVENTS_TOKEN: ${ESP_EVENTS_TOKEN:-dev-only-change-me}
    networks: [app, data, biometric]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging
    labels:
      ra.role: "business-api"

  # ------------------------------------------- Reconnaissance faciale (DeepFace)
  # API officielle github.com/serengil/deepface (tag épinglé), moteur ONNX.
  # Réseau `biometric` interne : seul payment-api la joint, jamais le WAF ni
  # l'extérieur ; jeton Bearer en plus. Poids des modèles embarqués à la
  # construction (pas d'accès Internet à l'exécution).
  face-api:
    <<: *sec
    build: ./services/face-api
    container_name: ra-face-api
    restart: unless-stopped
    pids_limit: 400
    environment:
      # Jeton vide = authentification DeepFace DÉSACTIVÉE : on l'exige.
      DEEPFACE_AUTH_TOKEN: ${FACE_API_TOKEN:?FACE_API_TOKEN manquant dans .env}
    networks: [biometric]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      ra.role: "face-recognition"

  # ------------------------------------------------------- Service d'auth (JWT)
  auth:
    <<: *sec
    build: ./services/auth
    container_name: ra-auth
    restart: unless-stopped
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      FACE_PENDING_EXPIRE_SECONDS: ${FACE_PENDING_EXPIRE_SECONDS:-120}
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging
    labels:
      ra.role: "auth"

  # ----------------------------------------------------------- Base de données
  postgres:
    <<: *sec
    image: postgres:16-alpine
    container_name: ra-postgres
    restart: unless-stopped
    pids_limit: 300
    # L'entrypoint démarre root puis bascule vers l'utilisateur postgres (gosu)
    # et ajuste les droits de PGDATA : ces 5 capabilities sont le strict minimum.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/payment-api/db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Grâce à l'initialisation (initdb + scripts seed) : sous charge (build +
      # démarrage simultané), les premiers checks ne doivent pas épuiser les retries.
      start_period: 40s
    logging: *default-logging
    labels:
      ra.role: "database"

  # -------------------------------------------------------- Observabilité
  prometheus:
    <<: *sec
    image: prom/prometheus:v2.54.1
    container_name: ra-prometheus
    restart: unless-stopped
    pids_limit: 200
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [obs, app]
    logging: *default-logging
    labels:
      ra.role: "metrics"

  loki:
    <<: *sec
    image: grafana/loki:3.1.1
    container_name: ra-loki
    restart: unless-stopped
    pids_limit: 200
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "logs"

  promtail:
    <<: *sec
    image: grafana/promtail:3.1.1
    container_name: ra-promtail
    restart: unless-stopped
    pids_limit: 200
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Socket en LECTURE SEULE : découverte des conteneurs (docker_sd). Collecte
      # de logs uniquement, aucune action -> surface moindre que le socket rw.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "log-shipper"

  # Micro-exporter maison : logs WAF -> métriques Prometheus par statut (signal fiable)
  waf-metrics:
    <<: *sec
    build: ./services/waf-metrics
    container_name: ra-waf-metrics
    restart: unless-stopped
    pids_limit: 100
    read_only: true           # n'écrit que dans le volume waf-logs (mount rw)
    tmpfs:
      - /tmp
    # Le WAF initialise le volume de logs en premier (permissions d'écriture).
    depends_on:
      - waf
    environment:
      WAF_ACCESS_LOG: "/var/log/ra/ra_access.log"
    volumes:
      # rw : l'exporter tronque le journal au-delà de WAF_LOG_MAX_BYTES.
      - waf-logs:/var/log/ra
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "waf-metrics"

  grafana:
    <<: *sec
    image: grafana/grafana:11.2.0
    container_name: ra-grafana
    restart: unless-stopped
    pids_limit: 200
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Tableau de supervision pour le jury (observation, pas gestion métier).
      # Même interface que le WAF (EDGE_BIND) ; port configurable via GRAFANA_PORT.
      - "${EDGE_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "supervision"

  # ------------------------------------- BFF supervision (lecture seule, dashboard)
  supervision-bff:
    <<: *sec
    build: ./services/supervision-bff
    container_name: ra-supervision-bff
    restart: unless-stopped
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      DETECTOR_URL: "http://ml-detector:9100"
      REMEDIATION_URL: "http://remediation-engine:9000"
      # Vérifie les JWT du service auth : /overview réservé à operator/admin.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    # app -> joignable par le WAF ; obs/control -> lecture de l'état (aucun droit
    # d'action : seule l'écriture /incident du moteur exige le jeton interne).
    networks: [app, obs, control]
    logging: *default-logging
    labels:
      ra.role: "supervision-bff"

  # -------------------------------------------------------- Détection ML (AIOps)
  ml-detector:
    <<: *sec
    build: ./services/ml-detector
    container_name: ra-ml-detector
    restart: unless-stopped
    pids_limit: 300
    read_only: true           # pas d'écriture runtime (modèle chargé en lecture)
    tmpfs:
      - /tmp
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      REMEDIATION_URL: "http://remediation-engine:9000"
      REMEDIATION_API_TOKEN: ${REMEDIATION_API_TOKEN}
      DETECTION_INTERVAL_SECONDS: ${DETECTION_INTERVAL_SECONDS:-10}
      ANOMALY_CONTAMINATION: ${ANOMALY_CONTAMINATION:-0.05}
      LOKI_URL: "http://loki:3100"
    networks: [obs, control]
    logging: *default-logging
    labels:
      ra.role: "ml-detector"

  # --------------------------------------------- Proxy socket Docker (durcissement)
  # Coupe-circuit entre le moteur de remédiation et le socket Docker (sujet §3.4).
  # Le moteur ne monte PLUS /var/run/docker.sock : il parle à ce proxy en TCP,
  # qui n'autorise QUE les appels dont la remédiation a besoin :
  #   CONTAINERS (inspect/get/logs/restart) + EXEC (nginx -s reload dans le WAF).
  # Tout le reste (images, volumes, réseaux, build, swarm, info...) est REFUSÉ :
  # même compromis, le moteur ne peut ni créer de conteneur privilégié, ni monter
  # un volume hôte, ni tirer une image -> plus d'évasion vers le PC Hôte.
  docker-socket-proxy:
    <<: *sec
    image: tecnativa/docker-socket-proxy:0.2
    container_name: ra-docker-proxy
    restart: unless-stopped
    pids_limit: 100
    environment:
      CONTAINERS: "1"   # GET inspect/list/logs + (avec POST) restart
      EXEC: "1"         # create/start exec -> uniquement `nginx -s reload`
      POST: "1"         # autorise les écritures des sections activées ci-dessus
      # Tout le reste explicitement refusé (défense en profondeur) :
      IMAGES: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      BUILD: "0"
      COMMIT: "0"
      INFO: "0"
      AUTH: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "1"      # requis par le client docker-py à la connexion
    volumes:
      # Socket en LECTURE SEULE : le proxy filtre, il n'a pas besoin d'écrire.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]
    logging: *default-logging
    labels:
      ra.role: "docker-proxy"

  # ------------------------------------------------- Moteur de remédiation
  remediation-engine:
    <<: *sec
    build: ./services/remediation-engine
    container_name: ra-remediation
    restart: unless-stopped
    pids_limit: 200
    # NON-ROOT (sujet §3.4) : uid 101 = propriétaire du volume waf-dynamic (= uid
    # nginx du WAF). La remédiation écrit la blocklist en tant que propriétaire,
    # sans aucune capability (DAC_OVERRIDE inutile), et le fichier produit est lu
    # par nginx (même uid). Plus de socket Docker, plus de root : surface minimale.
    user: "101:101"
    read_only: true           # blocklist écrite dans le volume waf-dynamic (rw)
    tmpfs:
      - /tmp
    depends_on:
      - docker-socket-proxy
    environment:
      REMEDIATION_API_TOKEN: ${REMEDIATION_API_TOKEN}
      WAF_CONTAINER: "ra-waf"
      WAF_DYNAMIC_DIR: "/waf-dynamic"
      CANARY_TARGET: "http://payment-api:8000"
      # Le client docker-py vise le proxy filtré, PLUS le socket brut (sujet §3.4).
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    volumes:
      # Volume partagé avec le WAF : écriture de la blocklist dynamique.
      # (Ce n'est PAS un privilège Docker : simple fichier de conf nginx.)
      - waf-dynamic:/waf-dynamic
    networks: [control, obs, app]
    logging: *default-logging
    labels:
      ra.role: "remediation"

  # ------------------------------------------------- Coffre des secrets (Vault)
  # Source de vérité des secrets (sujet §3.4). Les services ne l'interrogent
  # PAS au démarrage : le .env est rendu depuis Vault au déploiement
  # (scripts/vault.sh render, Ansible). Ainsi un Vault scellé n'empêche jamais
  # le moteur de remédiation de relancer un service pendant un incident.
  vault:
    <<: *sec
    image: hashicorp/vault:2.1.2
    container_name: ra-vault
    restart: unless-stopped
    command: server
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    ports:
      # Interface d'administration : TOUJOURS locale au PC Hôte (§4).
      - "127.0.0.1:8201:8200"
    networks: [secrets]
    # Sain = descellé (`vault status` sort en 2 si scellé).
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    labels:
      ra.role: "secrets"

  # ----------------------------------------------------- Assistant IA (RAG)
  # Profil `ai` : démarrage à la demande (RAM). Ollama peut tourner sur le
  # 3e PC (délestage IA) en pointant OLLAMA_BASE_URL vers son IP.
  ollama:
    <<: *sec
    # >= 0.6.6 requis pour l'architecture Qwen3 (et le pull hf.co/...).
    image: ollama/ollama:0.12.6
    container_name: ra-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [app]
    profiles: ["ai"]
    logging: *default-logging
    labels:
      ra.role: "llm-runtime"

  rag-assistant:
    <<: *sec
    build: ./services/rag-assistant
    container_name: ra-rag
    restart: unless-stopped
    pids_limit: 200
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/unsloth/Qwen3-4B-GGUF:Q4_K_M}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./docs:/app/corpus:ro
    ports:
      # Console assistant pour les opérateurs : TOUJOURS locale au PC Hôte
      # (sans authentification -> jamais sur EDGE_BIND / le réseau pédagogique).
      - "127.0.0.1:8200:8200"
    # `obs` (non interne) : Docker ne publie aucun port d'un conteneur
    # rattaché uniquement à des réseaux internes (`app`).
    networks: [app, obs]
    profiles: ["ai"]
    logging: *default-logging
    labels:
      ra.role: "rag-assistant"
