# ============================================================================
#  PROJECT RESILIENCE-ALPHA — Orchestration du démonstrateur
# ----------------------------------------------------------------------------
#  Segmentation réseau (sujet §4 : DB, secrets, interfaces de gestion ne sont
#  PAS exposés au réseau pédagogique) :
#    edge    -> seul point publié (WAF) sur l'IP du PC Hôte (192.168.137.1)
#    app     -> services métier, non publiés
#    data    -> Postgres, strictement interne
#    obs     -> chaîne d'observabilité
#    control -> moteur de remédiation (accès socket Docker), isolé
# ============================================================================

name: resilience-alpha

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  obs:
  control:
    internal: true

volumes:
  pgdata:
  grafana-data:
  prometheus-data:
  loki-data:
  ollama-data:
  waf-dynamic:
  waf-logs:

services:
  # ----------------------------------------------------------------- WAF (edge)
  waf:
    build: ./infra/waf
    container_name: ra-waf
    restart: unless-stopped
    depends_on:
      - frontend
      - payment-api
      - auth
      - supervision-bff
    ports:
      # Unique interface publiée, bindée sur l'IP du PC Hôte (sujet §4).
      # En local/CI, 0.0.0.0 ; en démo, remplacer par 192.168.137.1.
      - "${EDGE_BIND:-0.0.0.0}:8080:8080"
    environment:
      BACKEND_FRONTEND: "frontend:5173"
      BACKEND_API: "payment-api:8000"
      BACKEND_AUTH: "auth:8000"
      BACKEND_BFF: "supervision-bff:8000"
    volumes:
      - waf-dynamic:/etc/nginx/dynamic
      - waf-logs:/var/log/ra
    networks: [edge, app]
    logging: *default-logging
    labels:
      ra.role: "waf"

  # ------------------------------------------------------------- Frontend React
  frontend:
    build: ./services/frontend
    container_name: ra-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: "/api"
      VITE_AUTH_BASE: "/auth"
    networks: [app]
    logging: *default-logging
    labels:
      ra.role: "frontend"

  # --------------------------------------------------------------- API métier
  payment-api:
    build: ./services/payment-api
    container_name: ra-payment-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_BASE_URL: "http://auth:8000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging
    labels:
      ra.role: "business-api"

  # ------------------------------------------------------- Service d'auth (JWT)
  auth:
    build: ./services/auth
    container_name: ra-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging
    labels:
      ra.role: "auth"

  # ----------------------------------------------------------- Base de données
  postgres:
    image: postgres:16-alpine
    container_name: ra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/payment-api/db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Grâce à l'initialisation (initdb + scripts seed) : sous charge (build +
      # démarrage simultané), les premiers checks ne doivent pas épuiser les retries.
      start_period: 40s
    logging: *default-logging
    labels:
      ra.role: "database"

  # -------------------------------------------------------- Observabilité
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ra-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [obs, app]
    logging: *default-logging
    labels:
      ra.role: "metrics"

  loki:
    image: grafana/loki:3.1.1
    container_name: ra-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "logs"

  promtail:
    image: grafana/promtail:3.1.1
    container_name: ra-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "log-shipper"

  # Micro-exporter maison : logs WAF -> métriques Prometheus par statut (signal fiable)
  waf-metrics:
    build: ./services/waf-metrics
    container_name: ra-waf-metrics
    restart: unless-stopped
    # Le WAF initialise le volume de logs en premier (permissions d'écriture).
    depends_on:
      - waf
    environment:
      WAF_ACCESS_LOG: "/var/log/ra/ra_access.log"
    volumes:
      - waf-logs:/var/log/ra:ro
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "waf-metrics"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ra-grafana
    restart: unless-stopped
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Tableau de supervision pour le jury (observation, pas gestion métier).
      - "${EDGE_BIND:-0.0.0.0}:3000:3000"
    networks: [obs]
    logging: *default-logging
    labels:
      ra.role: "supervision"

  # ------------------------------------- BFF supervision (lecture seule, dashboard)
  supervision-bff:
    build: ./services/supervision-bff
    container_name: ra-supervision-bff
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      DETECTOR_URL: "http://ml-detector:9100"
      REMEDIATION_URL: "http://remediation-engine:9000"
    # app -> joignable par le WAF ; obs/control -> lecture de l'état (aucun droit
    # d'action : seule l'écriture /incident du moteur exige le jeton interne).
    networks: [app, obs, control]
    logging: *default-logging
    labels:
      ra.role: "supervision-bff"

  # -------------------------------------------------------- Détection ML (AIOps)
  ml-detector:
    build: ./services/ml-detector
    container_name: ra-ml-detector
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      REMEDIATION_URL: "http://remediation-engine:9000"
      REMEDIATION_API_TOKEN: ${REMEDIATION_API_TOKEN}
      DETECTION_INTERVAL_SECONDS: ${DETECTION_INTERVAL_SECONDS:-10}
      ANOMALY_CONTAMINATION: ${ANOMALY_CONTAMINATION:-0.05}
      LOKI_URL: "http://loki:3100"
    networks: [obs, control]
    logging: *default-logging
    labels:
      ra.role: "ml-detector"

  # ------------------------------------------------- Moteur de remédiation
  remediation-engine:
    build: ./services/remediation-engine
    container_name: ra-remediation
    restart: unless-stopped
    environment:
      REMEDIATION_API_TOKEN: ${REMEDIATION_API_TOKEN}
      WAF_CONTAINER: "ra-waf"
      WAF_DYNAMIC_DIR: "/waf-dynamic"
      CANARY_TARGET: "http://payment-api:8000"
    volumes:
      # Accès socket Docker : surface sensible -> réseau `control` isolé,
      # aucune UI d'admin exposée (sujet §3.4). Durcissement documenté (docs/).
      - /var/run/docker.sock:/var/run/docker.sock
      # Volume partagé avec le WAF : écriture de la blocklist dynamique.
      - waf-dynamic:/waf-dynamic
    networks: [control, obs, app]
    logging: *default-logging
    labels:
      ra.role: "remediation"

  # ----------------------------------------------------- Assistant IA (RAG)
  # Profil `ai` : démarrage à la demande (RAM). Ollama peut tourner sur le
  # 3e PC (délestage IA) en pointant OLLAMA_BASE_URL vers son IP.
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ra-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [app]
    profiles: ["ai"]
    logging: *default-logging
    labels:
      ra.role: "llm-runtime"

  rag-assistant:
    build: ./services/rag-assistant
    container_name: ra-rag
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./docs:/app/corpus:ro
    ports:
      # Console assistant pour les opérateurs (local au PC Hôte, non pédagogique).
      - "${EDGE_BIND:-127.0.0.1}:8200:8200"
    networks: [app]
    profiles: ["ai"]
    logging: *default-logging
    labels:
      ra.role: "rag-assistant"
