global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8000"]
        labels: { service: "payment-api" }

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000"]
        labels: { service: "auth" }

  - job_name: remediation-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation-engine:9000"]
        labels: { service: "remediation" }

  - job_name: ml-detector
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-detector:9100"]
        labels: { service: "ml-detector" }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
