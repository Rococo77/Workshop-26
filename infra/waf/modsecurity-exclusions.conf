# Exclusions locales OWASP CRS (point de personnalisation officiel : voir
# /opt/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf.example
# dans l'image). Exécuté avant les règles numérotées de la CRS.
#
# Méthodes HTTP : la CRS n'autorise par défaut que GET/HEAD/POST/OPTIONS
# (règle 911100, REQUEST-911-METHOD-ENFORCEMENT). Le back-office (§10.1)
# utilise PATCH (modifier un compte) et DELETE (réinitialiser un visage) :
# sans cette exclusion, le WAF les bloque en 403 avant même d'atteindre
# payment-api.
SecAction \
    "id:1000100,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH DELETE'"
