---
# ============================================================================
#  Restauration PRA de la base de paiement + VÉRIFICATION par transaction canari
#  (docs/pca-pra.md). Une sauvegarde n'a de valeur que si la restauration est
#  prouvée : ce playbook restaure PUIS vérifie que le service métier répond.
#
#  Opération destructive -> exige une confirmation explicite.
#
#  Usage :
#    # restaure la sauvegarde la plus récente de backups/
#    ansible-playbook restore.yml -e confirm=yes
#    # restaure un fichier précis
#    ansible-playbook restore.yml -e confirm=yes -e backup_file=backups/paymentdb_20261020_1200.sql
# ============================================================================
- name: Restauration PostgreSQL (PRA)
  hosts: host
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/../.."
    backup_dir: "{{ project_root }}/backups"
    pg_container: ra-postgres
    confirm: "no"
    backup_file: ""         # vide => dernière sauvegarde disponible
    ready_url: "http://127.0.0.1:8080/api/ready"

  tasks:
    - name: Garde-fou — confirmation requise (opération destructive)
      ansible.builtin.assert:
        that:
          - confirm | string | lower == "yes"
        fail_msg: >-
          Restauration destructive. Relancer avec -e confirm=yes pour accepter
          l'écrasement des données courantes.

    - name: Déterminer le fichier à restaurer (dernier par défaut)
      ansible.builtin.shell: >-
        {% if backup_file %}echo "{{ backup_file }}"{% else %}ls -1t "{{ backup_dir }}"/paymentdb_*.sql 2>/dev/null | head -n1{% endif %}
      args:
        chdir: "{{ project_root }}"
      changed_when: false
      register: chosen

    - name: Échec si aucune sauvegarde trouvée
      ansible.builtin.assert:
        that:
          - chosen.stdout | trim | length > 0
        fail_msg: "Aucune sauvegarde trouvée dans {{ backup_dir }}/ (lancer backup.yml d'abord)."

    - name: Fichier retenu
      ansible.builtin.debug:
        msg: "Restauration depuis : {{ chosen.stdout | trim }}"

    - name: Restaurer le dump dans PostgreSQL
      ansible.builtin.shell: >-
        docker exec -i {{ pg_container }} sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        < "{{ chosen.stdout | trim }}"
      args:
        chdir: "{{ project_root }}"
      changed_when: true

    - name: Vérifier le retour à un état utilisable (transaction canari)
      ansible.builtin.uri:
        url: "{{ ready_url }}"
        status_code: 200
      register: ready
      retries: 10
      delay: 3
      until: ready.status == 200

    - name: Résultat
      ansible.builtin.debug:
        msg: >-
          Restauration vérifiée : {{ chosen.stdout | trim }} -> service utilisable
          (/api/ready = 200). PRA prouvé, pas seulement supposé.
