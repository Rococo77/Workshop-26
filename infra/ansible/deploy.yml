---
# ============================================================================
#  Déploiement reproductible de la plateforme sur le PC Hôte.
#  Place d'Ansible : automatiser les opérations prévues au cahier des charges
#  (déploiement, déchiffrement des secrets, démarrage, vérification de santé).
# ============================================================================
- name: Déployer PROJECT RESILIENCE-ALPHA
  hosts: host
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/../.."
    with_ai: false  # true pour démarrer aussi Ollama + assistant RAG
    # Qwen3 4B par défaut ; 8B : -e ollama_model=hf.co/unsloth/Qwen3-8B-GGUF:Q4_K_M
    ollama_model: "hf.co/unsloth/Qwen3-4B-GGUF:Q4_K_M"

  tasks:
    - name: Vérifier la présence de Docker
      ansible.builtin.command: docker version
      changed_when: false

    - name: Détecter des secrets chiffrés (SOPS)
      ansible.builtin.stat:
        path: "{{ project_root }}/secrets.enc.env"
      register: enc_secrets

    - name: Vérifier qu'un .env est présent (voie démo locale, sans SOPS)
      ansible.builtin.stat:
        path: "{{ project_root }}/.env"
      register: env_present

    - name: Déchiffrer les secrets vers .env (SOPS/age)
      ansible.builtin.command: "bash scripts/secrets.sh decrypt"
      args:
        chdir: "{{ project_root }}"
      changed_when: true
      # Uniquement si des secrets chiffrés existent. Sinon, on s'appuie sur le
      # .env déjà présent (voie démo locale) -> pas de dépendance à sops.
      when: enc_secrets.stat.exists

    - name: Refuser de continuer sans secrets ni .env
      ansible.builtin.assert:
        that:
          - enc_secrets.stat.exists or env_present.stat.exists
        fail_msg: "Ni secrets.enc.env ni .env : copier .env.example -> .env."

    - name: Construire et démarrer la plateforme (cœur)
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        build: always
        state: present
      when: not with_ai

    # Ollama sur GPU NVIDIA si Docker peut l'utiliser, sinon CPU (même test
    # que scripts/up-ai.sh : réserver un GPU absent ferait échouer le compose).
    - name: Détecter un GPU utilisable par Docker
      ansible.builtin.shell: >-
        docker run --rm --gpus all --entrypoint true
        "$(grep -oE 'ollama/ollama:[^[:space:]]+' docker-compose.yml)"
      args:
        chdir: "{{ project_root }}"
      register: gpu_probe
      changed_when: false
      failed_when: false
      when: with_ai

    - name: Construire et démarrer la plateforme (cœur + IA)
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        files: "{{ ['docker-compose.yml'] + (['docker-compose.gpu.yml'] if gpu_probe.rc == 0 else []) }}"
        build: always
        state: present
        profiles: ["ai"]
      when: with_ai

    - name: Attendre que l'API métier soit prête
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/ready"
        status_code: 200
      register: ready
      retries: 20
      delay: 5
      until: ready.status == 200

    # Ollama vit sur le réseau `app` (internal: true, sans Internet) : accès
    # sortant ouvert le temps du pull uniquement, puis refermé quoi qu'il arrive.
    - name: Pré-charger les modèles Ollama
      when: with_ai
      block:
        - name: Ouvrir temporairement l'accès Internet d'Ollama
          ansible.builtin.command: docker network connect bridge ra-ollama
          changed_when: true
        - name: Télécharger les modèles
          ansible.builtin.command: "docker exec ra-ollama ollama pull {{ item }}"
          loop:
            - "{{ ollama_model }}"
            - "nomic-embed-text"
          changed_when: true
      always:
        - name: Refermer l'accès Internet d'Ollama
          ansible.builtin.command: docker network disconnect bridge ra-ollama
          changed_when: true
          failed_when: false

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "Plateforme déployée."
          - "Front + API : http://127.0.0.1:8080"
          - "Grafana      : http://127.0.0.1:3000"
