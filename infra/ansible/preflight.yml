---
# ============================================================================
#  Pré-vol : vérifie que le PC Hôte réunit les prérequis AVANT tout déploiement.
#  But : éliminer le « ça marche sur ma machine » (critère de reproductibilité,
#  sujet §3.2). Échoue tôt et clairement si un prérequis manque.
#
#  Usage :
#    ansible-playbook preflight.yml
#  (exécuté automatiquement par site.yml avant deploy.yml)
# ============================================================================
- name: Vérification des prérequis du PC Hôte
  hosts: host
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Docker est installé et le démon répond
      ansible.builtin.command: docker version
      changed_when: false
      register: docker_v
      failed_when: docker_v.rc != 0

    - name: Docker Compose v2 est disponible
      ansible.builtin.command: docker compose version
      changed_when: false
      register: compose_v
      failed_when: compose_v.rc != 0

    - name: La collection Ansible community.docker est installée
      ansible.builtin.command: ansible-galaxy collection list community.docker
      changed_when: false
      register: coll
      failed_when: "'community.docker' not in coll.stdout"

    - name: Détecter un coffre Vault initialisé
      ansible.builtin.stat:
        path: "{{ project_root }}/.vault/init.json"
      register: vault_init

    - name: Le conteneur Vault existe si le coffre est initialisé
      ansible.builtin.command: docker inspect ra-vault
      changed_when: false
      register: vault_ctr
      failed_when: vault_ctr.rc != 0
      when: vault_init.stat.exists

    - name: Un fichier d'environnement est disponible (.env ou Vault)
      ansible.builtin.stat:
        path: "{{ project_root }}/.env"
      register: envfile

    - name: Refuser de continuer sans secrets
      ansible.builtin.assert:
        that:
          - envfile.stat.exists or vault_init.stat.exists
        fail_msg: >-
          Ni Vault initialisé ni .env. Lancer scripts/vault.sh init (Vault) ou,
          en démo locale sans Vault, copier .env.example -> .env.
        success_msg: "Secrets disponibles."

    - name: Synthèse
      ansible.builtin.debug:
        msg:
          - "Docker        : OK"
          - "Compose v2     : OK"
          - "community.docker: OK"
          - "Secrets        : {{ 'Vault (.env rendu au déploiement)' if vault_init.stat.exists else '.env local' }}"
