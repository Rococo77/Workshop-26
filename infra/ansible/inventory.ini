# ============================================================================
#  Inventaire d'orchestration RESILIENCE-ALPHA.
#  Le nœud de contrôle Ansible (PC Hôte) pilote jusqu'à trois cibles :
#    [host] PC Hôte     -> tout le SI conteneurisé (obligatoire, connexion locale)
#    [ia]   PC Délestage-> Ollama déporté si la RAM du Hôte est insuffisante (opt.)
#    [esp]  ESP8266     -> objet connecté LED (provisioning WiFi, consigne B, opt.)
# ============================================================================

# --- PC Hôte : serveur du consortium (connexion directe) --------------------
[host]
pc-hote ansible_connection=local

# --- PC Délestage IA (optionnel) : héberge UNIQUEMENT Ollama ----------------
#  Décommenter et renseigner l'IP sur le PA du groupe (RESILIENCE-G<n>).
#  Puis : ansible-playbook deploy.yml -e with_ai=true -e ollama_host=pc-ia
# [ia]
# pc-ia ansible_host=192.168.137.50 ansible_user=operator

# --- ESP8266 (optionnel) : LED bicolore, consigne additionnelle 1 -----------
#  Flashé via PlatformIO (CLion). Ansible ne le pilote PAS en SSH (microcontrôleur)
#  mais sert à GÉNÉRER sa configuration WiFi/MQTT (SSID du PA, broker) depuis une
#  source unique, pour éviter des secrets en dur dans le firmware.
#  Renseigner l'IP fixe attribuée par le hotspot une fois l'objet connecté.
# [esp]
# esp-led ansible_host=192.168.137.60

# --- Variables communes au réseau du groupe ---------------------------------
[all:vars]
group_subnet=192.168.137.0/24
host_ip=192.168.137.1
