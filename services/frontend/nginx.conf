# Service des fichiers statiques du front, derrière le WAF (seul exposé).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Application monopage : /supervision et toute route inconnue -> index.html.
    location / {
        try_files $uri /index.html;
    }

    # Fichiers versionnés par Vite (hash dans le nom) : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
