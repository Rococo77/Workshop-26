; ============================================================================
;  Indicateur LED ESP8266 — reconnaissance faciale en temps réel.
;  Carte testée : AZ-Delivery NodeMCU (module ESP-12F, USB CH340).
;  Voir README.md pour le câblage et la configuration (secrets.h).
; ============================================================================
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.1.0
